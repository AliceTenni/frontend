name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

  build:
    name: Build & Bundle
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:3000' }}
          VITE_NETWORK: testnet
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN || '' }}
        run: npm run build

      - name: Enforce bundle size budgets
        run: node scripts/check-bundle-size.mjs

      - name: Scan for leaked secrets
        run: node scripts/scan-secrets.mjs

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  docker:
    name: Docker smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t synapsvault-frontend:ci .

      - name: Serve and health-check
        run: |
          docker run -d --name web -p 8080:80 synapsvault-frontend:ci
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/health; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          # SPA fallback: deep links must serve the app shell
          curl -fsS http://localhost:8080/some/deep/link | grep -q '<div id="root">'
          # The image's own HEALTHCHECK must report healthy
          for i in $(seq 1 20); do
            status=$(docker inspect --format '{{.State.Health.Status}}' web)
            [ "$status" = healthy ] && break
            sleep 2
          done
          echo "container health: $status"
          [ "$status" = healthy ]

      - name: Container logs
        if: always()
        run: docker logs web || true
