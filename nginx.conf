server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Gzip
  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;
  gzip_min_length 1024;

  # Security headers (repeated in locations below: nginx drops server-level
  # add_header directives in any location that defines its own)
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Container health check (see Dockerfile HEALTHCHECK)
  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Proxy backend route groups to the backend, injecting the real API key
  # server-side so it never reaches the browser.
  location ~ ^/(resources|agent|registry|publishers|buyers|payments)(/|$) {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-API-Key $backend_api_key;
    proxy_set_header Authorization "Bearer $backend_api_key";
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Cache fingerprinted static assets forever
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Never cache the service worker or the HTML shell, so deploys roll out
  location ~* ^/(sw\.js|index\.html)$ {
    add_header Cache-Control "no-cache";
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}